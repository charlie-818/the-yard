<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22262d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Yard — CC Dispatch</title>
<style>
  :root{
    /* Surfaces lifted off black: the list gutter, the row, the control.
       Three steps that are actually distinguishable on a phone in daylight. */
    --bg:#14171b; --panel:#1a1d23; --panel2:#22262d; --panel3:#2a2f38;
    --line:#333944; --line2:#434b58;
    --fg:#f2f5f9; --dim:#a8b2bf; --dimmer:#78828f;
    --red:#ff6b61; --amber:#ffc233; --green:#3ddc5c; --blue:#66a9ff;
    --violet:#bd8dff; --cyan:#5bd6cd;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    /* Squared off. Nothing rounder than a control needs to be. */
    --r:6px; --r2:8px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Chrome Android "font boosting" silently inflates text in wide blocks and
     Accessibility > text scaling multiplies every px. Either one blows a
     white-space:pre pane past the viewport no matter what size we compute. */
  html,body{margin:0;height:100%;overscroll-behavior:none;
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--fg);
    font:15px/1.45 var(--ui);
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .screen{display:none;flex-direction:column;flex:1;min-height:0}
  .screen.on{display:flex}

  header{display:flex;align-items:center;gap:10px;padding:11px 14px;
    border-bottom:1px solid var(--line);background:var(--panel2);flex:none}
  header .title{font:700 13px var(--ui);letter-spacing:.1em;flex:1;min-width:0;
    text-transform:uppercase;color:var(--fg);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Brand lockup: the clawd head as a mark, then the wordmark. Same block-guy
     geometry as the yard sprite, so the icon and the critters are one family. */
  .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .brand .logo{display:flex;align-items:center;flex:none}
  .brand svg{width:20px;height:20px;display:block}
  .brand .body{fill:#d77757}
  .brand .eye{fill:var(--panel2)}
  .brand .wm{font:700 13px var(--ui);letter-spacing:.16em;color:var(--fg);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .wm b{font-weight:700;color:#d77757}
  header .back{font:600 24px/1 var(--ui);color:var(--dim);padding:6px 12px 6px 0;margin:-6px 0;cursor:pointer}
  .meta{font:11px var(--mono);color:var(--dim);flex:none}
  /* hard-refresh: forces a full page reload so a stale JS shell can't linger */
  header .hardref{flex:none;background:none;border:1px solid var(--line);
    border-radius:6px;color:var(--dim);font:15px/1 var(--ui);width:30px;height:30px;
    cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
  header .hardref:active{transform:scale(.92);color:var(--fg)}
  /* Socket liveness lives on the logo: greyed mark = not connected. One less
     piece of chrome in a header that is mostly brand. */
  #brand{opacity:.5;filter:grayscale(.9);transition:opacity .2s,filter .2s}
  #brand.live{opacity:1;filter:none}
  .limit{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--dim);flex:none}
  .bar{width:44px;height:6px;border-radius:2px;background:var(--line2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--green);transition:width .4s}

  .list{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    min-width:0;background:var(--bg)}

  /* A row is a card on --panel over a --bg gutter, with a full-height status
     edge on the left. State is readable from the edge alone at arm's length. */
  .card{position:relative;display:flex;gap:12px;padding:12px 14px 12px 15px;
    background:var(--panel);border-bottom:1px solid var(--line);cursor:pointer}
  .card:active{background:var(--panel2)}
  .dot{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dimmer)}
  .card.working .dot{background:var(--amber)}
  .card.idle .dot{background:var(--line2)}
  .card.ended .dot{background:var(--line)}
  .card.waiting .dot{background:var(--red);animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .card .body{flex:1;min-width:0}

  .row1{display:flex;align-items:center;gap:7px}
  .name{font:700 16px/1.25 var(--ui);color:var(--fg);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row2{margin-top:4px;font:13px/1.35 var(--ui);color:var(--dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card.working .row2{color:var(--fg)}
  .card.waiting .row2{color:var(--amber)}
  .row3{margin-top:6px;display:flex;gap:10px;font:11px var(--mono);
    color:var(--dimmer);overflow:hidden;white-space:nowrap}
  .row3 b{color:var(--dim);font-weight:400}

  /* Status word, not a coloured pill. Uppercase + letterspacing scans faster
     than a shape does. */
  .tag{flex:none;font:700 10px var(--ui);letter-spacing:.1em;
    padding:3px 6px;border-radius:3px;background:var(--line);color:var(--dim)}
  .card.working .tag{background:rgba(255,194,51,.16);color:var(--amber)}
  .card.waiting .tag{background:var(--red);color:#1a1200}
  .card.ended .tag{background:var(--line);color:var(--dimmer)}
  .tag.ro{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--dimmer)}

  /* The terminal already hard-wrapped at N columns. Wrapping it AGAIN at the
     viewport width is what produced the ragged double-breaks — so we scale the
     font until N columns fit exactly, and never soft-wrap. */
  .pane{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
    margin:0;padding:12px 10px;font-family:var(--mono);background:var(--bg);
    color:var(--fg);-webkit-text-size-adjust:100%;text-size-adjust:100%;
    font-size:11px;line-height:1.42;white-space:pre;overflow-wrap:normal}
  .pane.wrap{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}

  /* Header toggle that reveals the control row. Collapsed by default — the
     terminal is what you came for; the controls are a deliberate second tap. */
  .hdrbtn{flex:none;background:var(--panel3);border:1px solid var(--line2);
    border-radius:var(--r);color:var(--dim);font:700 13px/1 var(--ui);
    letter-spacing:.06em;padding:8px 11px;cursor:pointer;margin:-2px -2px -2px 0}
  .hdrbtn:active{background:var(--line2)}
  .hdrbtn.on{background:var(--blue);border-color:var(--blue);color:#06172e}

  /* one compact row, itself collapsed behind the header toggle */
  .chips{display:none;gap:6px;flex:none;padding:7px 10px;background:var(--panel2);
    border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .chips.on{display:flex}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto;font:600 12px var(--ui);color:var(--fg);
    background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);
    padding:7px 12px;cursor:pointer;white-space:nowrap}
  .chips button:active{background:var(--line2)}
  .chips button.ghost{color:var(--violet);border-color:rgba(189,141,255,.4)}
  .chips button:disabled{opacity:.4}

  #sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;
    opacity:0;pointer-events:none;transition:opacity .2s}
  #sheet-bg.on{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;
    background:var(--panel2);border-top:1px solid var(--line2);
    border-radius:var(--r2) var(--r2) 0 0;padding:8px 14px
      calc(env(safe-area-inset-bottom) + 16px);
    transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.9,.3,1);
    max-height:72vh;overflow-y:auto}
  #sheet.on{transform:translateY(0)}
  #sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);
    margin:4px auto 14px}
  .sheet-title{font:700 11px var(--ui);color:var(--dim);
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .sheet-body{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;align-items:center;gap:11px;width:100%;
    background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);
    padding:14px 15px;cursor:pointer;text-align:left;color:var(--fg);
    font:600 15px var(--ui)}
  .opt:active{background:var(--line2)}
  .opt .desc{font:400 12px var(--mono);color:var(--dim);margin-left:auto}
  .opt.cur{border-color:var(--blue);background:rgba(102,169,255,.16);color:var(--blue)}
  .opt.confirm{border-color:var(--red);background:rgba(255,107,97,.18);color:var(--red)}
  .opt:disabled{opacity:.38}
  .sheet-note{font:11px/1.55 var(--ui);color:var(--dim);margin-top:6px}
  .sheet-note.warn{color:var(--red)}
  .c-dim{color:var(--dim)} .c-green{color:var(--green)} .c-red{color:var(--red)}
  .c-amber{color:var(--amber)} .c-blue{color:var(--blue)} .c-violet{color:var(--violet)}
  .c-cyan{color:var(--cyan)} .c-sel{color:var(--fg);font-weight:600}

  /* Contextual: Claude's own options when it asks something, interrupt keys
     while it works, nothing at all when idle. */
  .actionbar{flex:none;background:var(--panel2);border-top:1px solid var(--line2);
    padding:0;display:none}
  .actionbar.on{display:block;padding:10px}
  .actionbar .q{font:600 12px/1.4 var(--ui);color:var(--amber);
    margin:0 2px 9px;display:block}
  .actionbar .opts{display:flex;flex-direction:column;gap:6px}
  .actionbar .opts.row{flex-direction:row}
  .act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);
    padding:13px;cursor:pointer;color:var(--fg);font:600 14px var(--ui)}
  .act:active{background:var(--line2)}
  .act .num{display:inline-flex;align-items:center;justify-content:center;
    width:21px;height:21px;border-radius:3px;background:var(--line2);
    color:var(--fg);font:700 11px var(--mono);flex:none}
  .act.sel{border-color:var(--green);background:rgba(61,220,92,.14)}
  .act.sel .num{background:var(--green);color:#04210a}
  .act.yes{border-color:rgba(61,220,92,.5)}
  .act.no{border-color:rgba(255,107,97,.45);color:var(--red)}
  .act.slim{flex:1;justify-content:center;padding:12px 8px;font-size:13px}
  .act.stop{color:var(--red);border-color:rgba(255,107,97,.4)}

  .composer{flex:none;padding:9px 10px 11px;background:var(--panel2);
    border-top:1px solid var(--line2);display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;min-height:46px;max-height:132px;
    background:var(--panel);color:var(--fg);border:1px solid var(--line2);
    border-radius:var(--r);padding:12px 13px;
    font:15px/1.4 var(--ui);outline:none}
  .composer textarea:focus{border-color:var(--blue)}
  .composer textarea::placeholder{color:var(--dimmer)}
  .send{flex:none;width:46px;height:46px;border-radius:var(--r);border:none;
    background:var(--blue);color:#06172e;font-size:19px;font-weight:700;cursor:pointer}
  .send:disabled{background:var(--line);color:var(--dimmer)}

  #toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 84px);
    background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);padding:11px 14px;
    font:13px var(--ui);z-index:60;opacity:0;transform:translateY(12px);
    transition:all .22s;pointer-events:none}
  #toast.on{opacity:1;transform:translateY(0)}
  #toast.err{border-color:var(--red);color:var(--red)}
  .empty{padding:36px 20px;text-align:center;color:var(--dim);
    font:13px/1.7 var(--ui);white-space:pre-wrap;word-break:break-all}

  /* ── fleet terrarium ───────────────────────────────
     Every Claude pane is a "clawd" — the block-guy from cc-dashboard, here as a
     vector so he stays crisp on a phone. He crawls the yard; his behaviour is the
     status (walk=working, hop=needs you, snooze=idle), a thought bubble is what
     he's doing, and the ring at his feet is context used. Tap opens the session. */
  #yard{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #yard-status{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;padding:30px;text-align:center;color:var(--dim);
    font:13px/1.7 var(--ui);white-space:pre-wrap;word-break:break-word;z-index:8}
  /* spawn a new clawd — terracotta FAB, bottom-right of the yard */
  .fab{position:absolute;right:16px;bottom:16px;z-index:9;
    width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
    background:#d77757;color:#2a1206;font:300 32px/1 var(--ui);
    box-shadow:0 5px 16px rgba(0,0,0,.5);display:flex;align-items:center;
    justify-content:center;padding-bottom:3px;transition:transform .1s,background .15s}
  .fab:active{background:#c56b4a;transform:scale(.94)}
  .fab:disabled{opacity:.5}



  /* drop zone for the drag-to-kill gesture — only exists mid-drag */
  .trash{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) scale(.8);
    z-index:10;width:86px;height:86px;border-radius:50%;
    border:2px dashed rgba(255,107,97,.55);background:rgba(20,23,27,.9);
    display:flex;align-items:center;justify-content:center;
    font:300 40px/1 var(--ui);color:var(--red);opacity:0;pointer-events:none;
    transition:opacity .16s,transform .16s,border-color .16s,background .16s}
  .trash.on{opacity:1;transform:translateX(-50%) scale(1)}
  .trash.hot{border-color:var(--red);border-style:solid;color:var(--red);
    background:rgba(255,107,97,.18);transform:translateX(-50%) scale(1.14)}

  .critter{position:absolute;left:0;top:0;width:80px;height:100px;
    transform:translate(-999px,-999px);cursor:pointer;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    display:flex;flex-direction:column;align-items:center;will-change:transform}
  .critter.dragging{z-index:11;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6));
    transition:none}
  .critter.dragging .stage{transform:scale(1.14)}
  .critter.doomed .stage{transform:scale(.86);filter:grayscale(.5)}
  .critter.doomed .clawd .body,.critter.doomed .clawd .limb{fill:var(--red)}
  .critter.doomed .clawd .shade{fill:#a83a32}
  .critter .stage{position:relative;width:64px;height:58px}
  .critter.ended{opacity:.32;filter:grayscale(.7)}

  .ring{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:58px;height:20px;pointer-events:none}
  .ring path{fill:none;stroke-linecap:round}
  .ring .track{stroke:var(--line);stroke-width:3}
  .ring .fill{stroke-width:3;transition:stroke-dasharray .6s,stroke .6s}

  .clawd{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
    width:44px;height:40px;overflow:visible}
  .clawd .body{fill:#d77757}.clawd .shade{fill:#b85f42}
  .clawd .eye{fill:var(--bg);transition:all .12s}
  .clawd .limb{fill:#d77757;transform-box:fill-box;transform-origin:center;
    transition:transform .18s ease}
  .stage.walk .clawd{animation:cbob .5s ease-in-out infinite}
  .stage.walk .arm-l,.stage.walk .leg-r{animation:cswA .5s ease-in-out infinite}
  .stage.walk .arm-r,.stage.walk .leg-l{animation:cswB .5s ease-in-out infinite}
  @keyframes cbob{50%{transform:translateX(-50%) translateY(-2px)}}
  @keyframes cswA{50%{transform:rotate(16deg)}}
  @keyframes cswB{50%{transform:rotate(-16deg)}}
  .stage.hop{animation:chop .7s ease-in-out infinite}
  @keyframes chop{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}
    45%{transform:translateY(-4px)}60%{transform:translateY(-9px)}}
  .stage.wave .arm-r{transform:rotate(-140deg);transform-origin:20% 20%;
    animation:cwave .4s ease-in-out infinite}
  @keyframes cwave{50%{transform:rotate(-115deg)}}
  .critter.left .stage{transform:scaleX(-1)}

  .glow{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:52px;height:14px;border-radius:50%;filter:blur(6px);opacity:0;transition:opacity .3s}
  .working .glow{opacity:.5;background:var(--green)}
  .waiting .glow{opacity:.7;background:var(--red);animation:cglow 1.3s infinite}
  @keyframes cglow{50%{opacity:.26}}

  .ctag{margin-top:2px;font:600 10.5px var(--mono);letter-spacing:.02em;color:var(--dim);
    max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-align:center;padding:1px 6px;border-radius:4px;background:rgba(20,23,27,.72)}
  .working .ctag{color:var(--fg)}.waiting .ctag{color:var(--red)}
  /* how long this pane's current working spell has run, ticking live. Only the
     working clawds show it — an idle or waiting pane has no clock running. */
  .wtimer{display:none;margin-top:2px;font:600 10px var(--mono);
    letter-spacing:.04em;color:#2a1206;background:var(--amber);
    padding:1px 6px;border-radius:4px;text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .wtimer::before{content:"";display:inline-block;width:5px;height:5px;
    border-radius:50%;background:#2a1206;margin-right:4px;vertical-align:middle;
    animation:tpulse 1.1s ease-in-out infinite}
  @keyframes tpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .working .wtimer{display:inline-block}
  @media (prefers-reduced-motion:reduce){.wtimer::before{animation:none}}

  .bubble{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) scale(.9);
    min-width:60px;max-width:158px;padding:5px 9px;border-radius:9px;
    background:var(--panel3);border:1px solid var(--line2);
    font:500 10.5px/1.3 var(--mono);color:var(--fg);text-align:center;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;
    background:var(--panel3);border-right:1px solid var(--line2);
    border-bottom:1px solid var(--line2);transform:translateX(-50%) rotate(45deg)}
  .bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
  .bubble .verb{color:var(--green)}
  .waiting .bubble{border-color:var(--red);color:var(--amber)}
  .waiting .bubble .verb{color:var(--red)}
  @media (prefers-reduced-motion:reduce){
    .stage,.clawd,.limb,.glow{animation:none!important}}

  /* ── usage ─────────────────────────────────────────
     Chart hues from the validated dark set: blue #3987e5 (primary sequential),
     orange #d95926 (second sequential context). Re-verified vs the new surface
     #1a1d23 — all six checks PASS. Status hues are the fixed reserved palette. */
  :root{ --c-blue:#3987e5; --c-orange:#d95926;
         --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b; }
  .tabbar{display:flex;flex:none;border-top:1px solid var(--line2);background:var(--panel2)}
  .tabbar button{flex:1;background:none;border:none;cursor:pointer;
    padding:13px 0 calc(13px + env(safe-area-inset-bottom));
    font:700 11px var(--ui);letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);border-top:2px solid transparent;margin-top:-1px}
  .tabbar button.cur{color:var(--blue);border-top-color:var(--blue)}

  /* Usage is a monitor screen: it SCROLLS, most-urgent first. The running-agent
     cards up top are the point, so they get real room; the account totals sit
     below them. Nothing is clipped to force a single page anymore. */
  #usage-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;background:var(--bg);
    padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
  .usec{padding:14px 14px 0;min-width:0}
  .usec h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    font:700 10px var(--ui);color:var(--dim);letter-spacing:.13em;
    text-transform:uppercase;margin:0 0 10px}
  .usec h3 em{font-style:normal;color:var(--dimmer);letter-spacing:.04em}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:10px 12px;min-width:0;overflow:hidden}
  .tile .k{font:600 10px var(--ui);color:var(--dim);letter-spacing:.09em;
    text-transform:uppercase}
  .tile .v{font:700 20px/1.15 var(--mono);color:var(--fg);margin-top:4px;
    overflow-wrap:anywhere}
  .tile .s{font:11px/1.4 var(--mono);color:var(--dimmer);margin-top:2px;
    overflow-wrap:anywhere}

  .meter{margin-bottom:11px;min-width:0}
  .meter:last-child{margin-bottom:0}
  .meter .top{display:flex;justify-content:space-between;align-items:baseline;
    gap:8px;font:12px var(--ui);color:var(--dim);margin-bottom:5px}

  .agents{display:flex;flex-direction:column;gap:10px}
  .ucard{background:var(--panel);border:1px solid var(--line);

  .ucard .ctxbar{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .ucard .ctxbar .track{flex:1;height:11px}
  .ucard .ctxbar b{flex:none;font:700 12px var(--mono);color:var(--fg)}
  .ucard .ctxbar span{flex:none;font:10px var(--ui);letter-spacing:.06em;
    text-transform:uppercase;color:var(--dim)}
  /* one compact line: tokens · prompts · files · lines change */
  .ucard .stats{font:11.5px/1.4 var(--mono);color:var(--dimmer);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ucard .stats b{color:var(--fg);font-weight:700}
  .ucard .stats .add{color:var(--green)} .ucard .stats .del{color:var(--red)}
  .ucard .foot{margin-top:10px;font:10.5px var(--mono);color:var(--dimmer);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .tiles.tri{grid-template-columns:repeat(3,1fr)}

  /* ── lock screen ───────────────────────────────────
     Covers everything until the passkey says otherwise. It is a cover, not a
     route: the fleet keeps its state underneath, so unlocking is instant. */
  #lock{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:32px;
    background:var(--bg);text-align:center}
  #lock.on{display:flex}
  #lock .mark svg{width:56px;height:56px}
  #lock .mark .body{fill:#d77757} #lock .mark .eye{fill:var(--bg)}
  #lock h2{font:700 15px var(--ui);letter-spacing:.14em;text-transform:uppercase;
    color:var(--fg);margin:4px 0 0}
  #lock p{font:13px/1.6 var(--ui);color:var(--dim);margin:0;max-width:19em}
  #lock button{background:#d77757;border:none;border-radius:var(--r);
    color:#2a1206;font:700 15px var(--ui);padding:14px 26px;cursor:pointer}
  #lock button:active{background:#c56b4a}
  #lock button.ghost{background:none;border:1px solid var(--line2);color:var(--dim);
    font-weight:600;padding:10px 18px}
  #lock .warn{color:var(--amber);font:12px/1.6 var(--mono);max-width:22em}
  #lock .err{color:var(--red);font:12px/1.5 var(--mono);max-width:22em;min-height:1em}
</style>

<div id="toast"></div>

<script>
/* A phone has no devtools. Any uncaught error is shown on the yard AND posted
   to the server log, so a blank "connecting…" is never a mystery again. */
function _report(msg){
  try {
    const st = document.getElementById('yard-status');
    if (st){ st.textContent = 'JS error:\n' + msg; st.style.display = 'flex'; }
    fetch('/api/clientlog', {method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify({msg})}).catch(()=>{});
  } catch(_){}
}
window.addEventListener('error', e =>
  _report(`${e.message} @ ${e.filename||''}:${e.lineno}:${e.colno}`));
window.addEventListener('unhandledrejection', e =>
  _report('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));

/* No secret lives in this file or in the URL. The server swapped the QR token
   for an HttpOnly session cookie before this page was ever served, and the
   cookie rides along automatically — including on the websockets. */
const Q = '';
let SESSIONS = [], current = null, paneWS = null;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* Claude's TUI has a small, stable vocabulary of line prefixes. Colouring on
   those is cheaper and more robust than shipping full ANSI over the wire. */
function colorize(text){
  return text.split('\n').map(l => {
    const e = esc(l);
    if (/^\s*[●⏺]/.test(l))            return `<span class="c-violet">${e}</span>`;
    if (/^\s*⎿/.test(l))                return `<span class="c-dim">${e}</span>`;
    if (/^\s*[✻✽*]/.test(l))            return `<span class="c-amber">${e}</span>`;
    if (/^\s*❯/.test(l))                return `<span class="c-sel">${e}</span>`;
    if (/^\s*\d\.\s/.test(l))           return `<span class="c-dim">${e}</span>`;
    if (/(error|failed|refus)/i.test(l))return `<span class="c-red">${e}</span>`;
    if (/[█▓]|\d+%/.test(l))            return `<span class="c-cyan">${e}</span>`;
    if (/^\s*>/.test(l))                return `<span class="c-green">${e}</span>`;
    if (/^\s*[─━]{4,}/.test(l))         return `<span class="c-dim">${e}</span>`;
    return e;
  }).join('\n');
}

function toast(msg, err){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'on' + (err ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(()=>t.className='', 2600);
}
const buzz = n => navigator.vibrate && navigator.vibrate(n);

/* ── fleet terrarium ───────────────────────────────────
   The fleet is a yard of clawds — one per pane. renderFleet() reconciles the live
   rows into that troupe; a single rAF loop crawls them. Behaviour IS status:
   working walks, waiting hops + waves, idle snoozes, ended greys out. The ring at
   his feet is context used, the bubble is what he's doing, tap opens the session. */
let PENDING_PANE = '';
let LIMITS = null;
function renderFleet(rows){
  SESSIONS = rows;
  // the usage screen reads the same live rows, so repaint it in place
  if (document.getElementById('s-usage').classList.contains('on')) renderUsage();
  // ?pane=<uuid> deep link. The first frame off the socket can be an empty
  // list, so only spend the link once there is actually a fleet to match in.
  if (PENDING_PANE && rows.length){
    const want = PENDING_PANE; PENDING_PANE = '';
    const hit = rows.find(r => r.uuid.toUpperCase().startsWith(want.toUpperCase()));
    if (hit) openSession(hit.uuid);
  }
  if (current){                     // keep the open session's effort in sync
    const fresh = rows.find(r => r.uuid === current.uuid);
    if (fresh){ current = fresh; markEffort(fresh.effort); markMode(fresh.mode); markModel(fresh.model); renderActions(); }
  }
  document.getElementById('fleet-meta').textContent =
    `${rows.length} pane${rows.length===1?'':'s'}`;
  const st = document.getElementById('yard-status');
  if (!rows.length){ st.textContent = 'no Claude panes found'; st.style.display = 'flex'; }
  else { st.style.display = 'none'; }
  syncCritters(rows);
}

let tries = 0;
function status(msg){
  if (SESSIONS.length) return;
  const st = document.getElementById('yard-status');
  st.textContent = msg; st.style.display = 'flex';
}

/* ── clawd sprite + engine ─────────────────────────────
   Vector clawd: the eyes are the black gaps of the block-guy, kept as bg-coloured
   notches so he reads the same as the TUI original in cc-dashboard. */
const CLAWD_SVG = `
<svg class="clawd" viewBox="0 0 44 40">
  <rect class="limb leg-l" x="13" y="30" width="7" height="10" rx="2"/>
  <rect class="limb leg-r" x="24" y="30" width="7" height="10" rx="2"/>
  <rect class="limb arm-l" x="1"  y="14" width="7" height="15" rx="3.5"/>
  <rect class="limb arm-r" x="36" y="14" width="7" height="15" rx="3.5"/>
  <rect class="body"  x="7" y="6" width="30" height="28" rx="7"/>
  <rect class="shade" x="7" y="26" width="30" height="8" rx="4"/>
  <rect class="body"  x="7" y="6" width="30" height="24" rx="7"/>
  <rect class="eye" x="14" y="15" width="6" height="7" rx="2"/>
  <rect class="eye" x="24" y="15" width="6" height="7" rx="2"/>
</svg>`;
const RING_LEN = 60;                                  // path length of the ctx arc
const reduceMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
const CRITTERS = new Map();                            // uuid → critter

const stateOf = s => s.prompt ? 'waiting' : (s.state || 'idle');
const ctxColor = p => p >= 85 ? 'var(--c-red)' : p >= 60 ? 'var(--c-amber)' : 'var(--c-blue)';

/* what a pane is doing, distilled from its screen tail into {verb, rest} */
// Skip Claude's chrome: mode/keybind footers AND the status line (model name,
// context %, token/interrupt counters) — context is the ring, not the bubble.
const YARD_NOISE = /mode on|bypass permissions|shift\+tab|for shortcuts|context (left|used)|\btokens\b|esc to interrupt|\b(opus|sonnet|haiku)\b|\d+\s?%|^\W*$/i;
const TOOL_RE = /^\s*[⏺●]\s*([A-Za-z]+)\((.*?)\)/;
const VERBS = {Edit:'editing',MultiEdit:'editing',Write:'writing',Read:'reading',
  Bash:'running',Grep:'searching',Glob:'searching',Task:'dispatching',
  WebFetch:'fetching',WebSearch:'searching'};
function shortArg(a){
  a = a.split(',')[0].trim().replace(/^["']|["']$/g,'');
  const p = a.split('/'); return (p[p.length-1] || a).slice(0,24);
}
function activity(s){
  const st = stateOf(s);
  if (st === 'waiting') return {verb:'!', rest:(s.prompt && s.prompt.question) || 'needs an answer'};
  if (st === 'ended')   return {verb:'', rest:'done'};
  const lines = (s.tail || []).filter(x => x.trim() && !YARD_NOISE.test(x));
  for (let i = lines.length - 1; i >= 0; i--){
    const m = lines[i].match(TOOL_RE);
    if (m) return {verb:VERBS[m[1]] || m[1].toLowerCase(), rest:shortArg(m[2])};
  }
  if (st === 'idle') return {verb:'', rest:'idle'};
  const last = (lines.slice(-1)[0] || '').replace(/^[\s✻✽*⏺●⎿❯>]+/,'').slice(0,36);
  return {verb:'', rest:last || 'working'};
}
function bubbleHTML(s){
  const a = activity(s);
  return (a.verb ? `<span class="verb">${esc(a.verb)}</span> ` : '') + esc(a.rest);
}

/* reconcile live rows into the troupe: add new, drop gone, update the rest */
function syncCritters(rows){
  const seen = new Set();
  rows.forEach(s => {
    seen.add(s.uuid);
    let c = CRITTERS.get(s.uuid) || spawnCritter(s);
    c.s = s; c.state = stateOf(s);
    const dash = ((s.ctx || 0) / 100 * RING_LEN).toFixed(1);   // ring = ctx used
    c.fill.setAttribute('stroke-dasharray', `${dash} 200`);
    c.fill.setAttribute('stroke', ctxColor(s.ctx || 0));
    c.tag.textContent = s.name;
  });
  for (const [uuid, c] of CRITTERS){          // panes that vanished walk off
    if (!seen.has(uuid)){ c.el.remove(); CRITTERS.delete(uuid); }
  }
}
/* elapsed seconds → a compact clock: 0:42, 7:18, 1:03:5 (h:mm for long runs) */
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function spawnCritter(s){
  const el = document.createElement('div');
  el.className = 'critter';
  el.innerHTML =
    `<div class="stage">
       <div class="glow"></div>${CLAWD_SVG}
       <svg class="ring" viewBox="0 0 58 20">
         <path class="track" d="M4 18 A25 25 0 0 1 54 18"/>
         <path class="fill"  d="M4 18 A25 25 0 0 1 54 18"/>
       </svg>
     </div>
     <div class="bubble"></div>
     <div class="ctag"></div>
     <div class="wtimer"></div>`;
  el.onclick = () => {
    if (Date.now() - dragEndedAt < 400) return;   // the drop is not also a tap
    buzz(8); openSession(s.uuid);
  };
  document.getElementById('yard').appendChild(el);
  const c = {
    uuid:s.uuid, s, el,
    stage:el.querySelector('.stage'), bubble:el.querySelector('.bubble'),
    fill:el.querySelector('.fill'), tag:el.querySelector('.ctag'),
    wtimer:el.querySelector('.wtimer'), _wt:'',
    x:null, y:0, vx:0, vy:0, facing:1, next:0, greet:0, bubbleOn:false, _cls:'', _sc:'',
    tx:null, ty:0,
    drag:false,
  };
  CRITTERS.set(s.uuid, c);
  attachDrag(c);
  return c;
}

/* ── drag a clawd into the trash to end his session ────
   Press and hold picks him up (a plain tap still opens the pane); the bin only
   appears once you are actually holding one, and the drop asks before killing —
   closing a pane cannot be undone. */
const HOLD_MS = 400;
let dragEndedAt = 0;

function overTrash(x, y){
  const r = document.getElementById('trash').getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  return Math.hypot(x - cx, y - cy) < r.width/2 + 26;   // generous for thumbs
}

function attachDrag(c){
  const el = c.el, trash = document.getElementById('trash');
  let hold = null, sx = 0, sy = 0, on = false;

  const place = (x, y) => {
    const r = document.getElementById('yard').getBoundingClientRect();
    c.x = x - r.left - 40; c.y = y - r.top - 62;
    el.style.transform = `translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px)`;
  };

  // a press-and-hold is a gesture here, not a text selection or a long-press menu
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('selectstart', e => e.preventDefault());
  el.addEventListener('dragstart', e => e.preventDefault());

  el.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY;
    hold = setTimeout(() => {
      on = true; c.drag = true; buzz(30);
      el.classList.add('dragging');
      trash.classList.add('on');
      try { el.setPointerCapture(e.pointerId); } catch(_){}
      place(sx, sy);
    }, HOLD_MS);
  });

  el.addEventListener('pointermove', e => {
    if (!on){
      // a scroll or a sloppy tap cancels the pickup before it starts
      if (Math.abs(e.clientX-sx) + Math.abs(e.clientY-sy) > 12) clearTimeout(hold);
      return;
    }
    e.preventDefault();
    place(e.clientX, e.clientY);
    const hot = overTrash(e.clientX, e.clientY);
    trash.classList.toggle('hot', hot);
    if (hot !== el.classList.contains('doomed')) buzz(hot ? 18 : 6);
    el.classList.toggle('doomed', hot);
  });

  const drop = e => {
    clearTimeout(hold);
    if (!on) return;
    on = false; c.drag = false; dragEndedAt = Date.now();
    el.classList.remove('dragging', 'doomed');
    trash.classList.remove('on', 'hot');
    if (e.type !== 'pointercancel' && overTrash(e.clientX, e.clientY)) askKill(c);
  };
  el.addEventListener('pointerup', drop);
  el.addEventListener('pointercancel', drop);
}

let killTarget = null;
function askKill(c){
  killTarget = c.s;
  buzz(24);
  openSheet('kill');
}

async function killPane(uuid, name){
  closeSheet();
  try {
    await post('/api/kill', {uuid});
    toast(`${name} killed`);
  } catch(e){ toast(String(e.message), true); }
}

/* The clawds crawl an empty yard now — no scenery, no landmarks. Two behaviours
   remain: a firm separation so they never overlap, and a wave when two pass
   close. Personal space is an ellipse — they crowd side-to-side more than
   front-to-back, matching the perspective — so all distances squash y by SQUAT. */
const CLAWD_GAP = 66;                  // closest two clawds ever stand (feet)
const SQUAT = 1.6;                     // y compressed this much in every distance

/* Usable ground: the box origin ranges the feet can occupy without a clawd
   clipping the header or the tab bar. One definition, used by placement,
   steering and clamping alike. */
function bounds(W, H){
  return {x0: 16, x1: Math.max(16, W - 96), y0: 56, y1: Math.max(56, H - 150)};
}

/* Spread newcomers across the WHOLE yard instead of dropping them at random —
   a jittered grid sized to the crowd, so the first frame is already well
   spaced and every corner gets used. Occupied cells (clawds already placed)
   are skipped so a reconnect slots new arrivals into the gaps. */
function placeClawds(W, H){
  const need = [...CRITTERS.values()].filter(c => c.x == null && !c.drag);
  if (!need.length) return;
  const b = bounds(W, H);
  const total = CRITTERS.size;
  const cols = Math.max(1, Math.ceil(Math.sqrt(total * (b.x1 - b.x0) /
                                    Math.max(1, (b.y1 - b.y0) * SQUAT))));
  const rows = Math.max(1, Math.ceil(total / cols));
  const cw = (b.x1 - b.x0) / cols, ch = (b.y1 - b.y0) / rows;
  const taken = [...CRITTERS.values()].filter(c => c.x != null)
    .map(c => [Math.floor((c.x - b.x0) / cw), Math.floor((c.y - b.y0) / ch)]);
  const free = [];
  for (let r = 0; r < rows; r++) for (let cX = 0; cX < cols; cX++)
    if (!taken.some(([tx, ty]) => tx === cX && ty === r)) free.push([cX, r]);
  for (let i = free.length - 1; i > 0; i--){        // shuffle so it's not a raster
    const j = Math.floor(Math.random() * (i + 1)); [free[i], free[j]] = [free[j], free[i]];
  }
  need.forEach((c, i) => {
    const [cX, r] = free[i % free.length] || [i % cols, Math.floor(i / cols) % rows];
    c.x = b.x0 + (cX + 0.22 + Math.random() * 0.56) * cw;
    c.y = b.y0 + (r  + 0.22 + Math.random() * 0.56) * ch;
  });
}

/* Push overlapping clawds apart (feet, not heads). Several relaxation passes so
   a tight knot fully unpacks in one frame instead of oozing apart over many;
   the edge clamp is inside the loop so a clawd pinned to the wall still gives
   ground sideways rather than staying stuck in someone. */
function resolveCollisions(W, H){
  const arr = [...CRITTERS.values()].filter(c => c.x != null && !c.drag);
  const b = bounds(W, H);
  for (let pass = 0; pass < 4; pass++){
    for (let i = 0; i < arr.length; i++){
      for (let j = i + 1; j < arr.length; j++){
        const a = arr[i], q = arr[j];
        let dx = q.x - a.x, dy = (q.y - a.y) * SQUAT;
        let d = Math.hypot(dx, dy);
        if (d >= CLAWD_GAP) continue;
        if (d < 0.01){ dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = 0.5; }
        const push = (CLAWD_GAP - d) / 2, ux = dx / d, uy = dy / d;
        a.x -= ux * push; a.y -= uy * push / SQUAT;
        q.x += ux * push; q.y += uy * push / SQUAT;
      }
    }
    arr.forEach(c => {
      c.x = Math.min(Math.max(c.x, b.x0), b.x1);
      c.y = Math.min(Math.max(c.y, b.y0), b.y1);
    });
  }
}

let lastT = 0;
function tick(t){
  const yard = document.getElementById('yard');
  const W = yard.clientWidth, H = yard.clientHeight;
  const dt = Math.min(50, t - lastT) / 16.7; lastT = t;
  const now = t / 1000;
  const liveView = W > 60;                       // fleet screen actually on-screen

  if (liveView) placeClawds(W, H);               // spread any newcomers first

  CRITTERS.forEach(c => {
    const s = c.s, st = c.state;
    if (c.drag) return;                          // the finger owns him right now
    if (!liveView || c.x == null) return;

    // heavier context → slower crawl (a loaded clawd trudges)
    const speed = (0.35 + (1 - (s.ctx || 0) / 100) * 0.5) * (st === 'working' ? 1 : 0.5);
    if (st === 'working' || st === 'idle'){
      if (now > c.next){                          // re-roll a wander heading
        c.next = now + (st === 'idle' ? 2 + Math.random()*4 : 1 + Math.random()*2);
        const ang = Math.random() * Math.PI * 2;
        c.vx = Math.cos(ang) * speed; c.vy = Math.sin(ang) * speed * 0.6;
        if (st === 'idle' && Math.random() < 0.4){ c.vx = c.vy = 0; }
      }
      // aware of each other: steer away from a neighbour before touching him,
      // so they part like people in a room, not billiard balls after impact
      CRITTERS.forEach(o => {
        if (o === c || o.x == null) return;
        const dx = c.x - o.x, dy = (c.y - o.y) * SQUAT, d = Math.hypot(dx, dy);
        if (d > 0.01 && d < CLAWD_GAP * 1.7){
          const f = (1 - d / (CLAWD_GAP * 1.7)) * 0.18;
          c.vx += dx / d * f; c.vy += dy / d * f / SQUAT;
        }
      });
    } else { c.vx = c.vy = 0; }                   // waiting / ended hold position

    if (!reduceMotion){ c.x += c.vx * dt; c.y += c.vy * dt; }
    if (c.x < 16){ c.x = 16; c.vx = Math.abs(c.vx); }
    if (c.x > W-96){ c.x = W-96; c.vx = -Math.abs(c.vx); }
    if (c.y < 56){ c.y = 56; c.vy = Math.abs(c.vy); }
    if (c.y > H-150){ c.y = H-150; c.vy = -Math.abs(c.vy); }
    if (Math.abs(c.vx) > 0.01) c.facing = c.vx < 0 ? -1 : 1;

    const moving = Math.abs(c.vx) + Math.abs(c.vy) > 0.05;
    const cls = 'critter ' + st + (c.facing < 0 ? ' left' : '');
    if (cls !== c._cls){ c.el.className = cls; c._cls = cls; }
    const scl = 'stage' + (moving && st !== 'waiting' ? ' walk' : '')
                        + (st === 'waiting' ? ' hop wave' : '');
    if (scl !== c._sc){ c.stage.className = scl; c._sc = scl; }

    // Idle clawds say nothing — a snoozing pane has no news, and a yard full of
    // Zzz bubbles buries the one clawd that actually needs you.
    let show = st === 'waiting';
    if (st === 'working') show = (now % 6) < 3.5;
    if (st === 'idle')    show = false;
    if (show && !c.bubbleOn) c.bubble.innerHTML = bubbleHTML(s);
    if (show !== c.bubbleOn){ c.bubble.classList.toggle('on', show); c.bubbleOn = show; }

    // live working timer — recomputed each frame from the server's start epoch,
    // so it keeps ticking between the ~1s fleet updates
    if (st === 'working' && s.work_since){
      const txt = fmtDur(Date.now()/1000 - s.work_since);
      if (txt !== c._wt){ c.wtimer.textContent = txt; c._wt = txt; }
    } else if (c._wt){ c.wtimer.textContent = ''; c._wt = ''; }
  });

  // Usage screen's freshness label rides this same loop, so it ticks off the
  // client clock every frame just like the working timers above.
  if (document.getElementById('s-usage').classList.contains('on')){
    paintUsageAge();
    // tick each running card's timer off work_since, same as the fleet above
    document.querySelectorAll('#usage-body .age[data-since]').forEach(n => {
      const since = +n.dataset.since;
      if (since){ const t = fmtDur(Date.now()/1000 - since);
        if (t !== n.textContent) n.textContent = t; }
    });
  }

  // separation runs on the settled positions, then everyone is painted once
  if (liveView) resolveCollisions(W, H);
  CRITTERS.forEach(c => {
    if (c.x == null || c.drag) return;
    c.el.style.transform = `translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px)`;
  });

  // two nearby non-waiting clawds turn and wave at each other
  if (liveView && !reduceMotion){
    const arr = [...CRITTERS.values()].filter(c => c.x != null &&
      c.state !== 'waiting' && c.state !== 'ended');
    for (let i = 0; i < arr.length; i++) for (let j = i+1; j < arr.length; j++){
      const a = arr[i], b = arr[j], dx = a.x-b.x, dy = a.y-b.y;
      if (dx*dx + dy*dy < 72*72 && now > a.greet && now > b.greet){
        a.greet = b.greet = now + 7;
        [[a,b],[b,a]].forEach(([who,other]) => {
          who.vx = who.vy = 0; who.next = now + 1.4;
          who.facing = other.x > who.x ? 1 : -1;
          who.stage.classList.add('wave');
          setTimeout(() => who.stage.classList.remove('wave'), 1300);
        });
      }
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function connectFleet(){
  const url = `${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/fleet${Q}`;
  tries++;
  status(`connecting… (try ${tries})\n${url}`);
  let ws;
  try { ws = new WebSocket(url); }
  catch(e){ status('WebSocket ctor failed: ' + e.message); return; }
  ws.onopen  = () => { tries = 0; document.getElementById('brand').classList.add('live');
                       status('connected, waiting for data…'); };
  ws.onerror = () => status(`socket error — cannot reach ${location.host}`);
  ws.onclose = ev => {
    document.getElementById('brand').classList.remove('live');
    // 1008/1006 right after open with no data almost always means auth refused
    status(`disconnected (code ${ev.code}${ev.reason ? ' ' + ev.reason : ''})`);
    // A socket refused because the session went stale must land on the lock
    // screen, not retry forever against a server that will keep saying no.
    authState().then(a => {
      if (!a.session) return lock('gone');
      if (a.level !== 'verified' && a.passkey_capable) return lock('idle');
      setTimeout(connectFleet, 2000);
    }).catch(() => setTimeout(connectFleet, 2000));
  };
  ws.onmessage = e => {
    let d;
    try { d = JSON.parse(e.data); }
    catch(err){ status('bad JSON from server: ' + err.message); return; }
    try { if (d.sessions) renderFleet(d.sessions); }
    catch(err){ status('render failed: ' + err.message); return; }
    if (d.limits) LIMITS = d.limits;
    const fh = d.limits && d.limits.five_hour;
    if (fh && fh.used_percentage != null){
      document.getElementById('lim5').style.width = fh.used_percentage + '%';
      document.getElementById('lim5t').textContent = pct(fh.used_percentage);
    }
  };
}

/* ── session ───────────────────────────────────────── */
function openSession(uuid){
  current = SESSIONS.find(s => s.uuid === uuid);
  if (!current) return;
  // Entering a chat starts with the header controls collapsed — the terminal
  // owns the screen; open the ••• row deliberately if you want the chips.
  chipsOpen = false; applyChips();
  document.getElementById('st').textContent = current.name;
  updateMeta();
  document.querySelectorAll('.chips button:not(.ghost)').forEach(b => b.disabled = !current.sendable);
  document.getElementById('sendbtn').disabled = !current.sendable;
  document.getElementById('input').placeholder =
    current.sendable ? '' : 'read-only';
  document.getElementById('s-fleet').classList.remove('on');
  document.getElementById('s-usage').classList.remove('on');
  document.getElementById('s-session').classList.add('on');
  document.getElementById('pane').textContent = 'loading…';

  markEffort(current.effort); markMode(current.mode); markModel(current.model);
  livePrompt = current.prompt || null; renderActions();
  history = []; live = '';
  if (paneWS) paneWS.close();
  paneWS = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws/pane/${uuid}${Q}`);
  paneWS.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.gone) { toast('pane closed', true); showFleet(); return; }
    if (d.history) history = d.history;
    if (d.text != null) live = d.text;
    // fit AFTER the text lands — it sizes against the widest line we hold
    if (d.cols) cols = d.cols;
    fitFont(cols);
    if (d.prompt !== undefined){ livePrompt = d.prompt; renderActions(); }
    paint();
  };
}

/* history (scrollback, sent once) sits above the live screen */
let history = [], live = '', cols = 80, fitMode = 0;   // 0 = fit cols, 1 = wrap

function paint(){
  const p = document.getElementById('pane');
  const stick = p.scrollTop + p.clientHeight >= p.scrollHeight - 60;
  // trailing blank lines between scrollback and live screen just waste space
  const hist = history.join('\n').replace(/\n+$/, '');
  p.innerHTML = colorize(hist ? hist + '\n' + live : live);
  if (fitMode === 0) shrinkToFit(p);
  if (stick) p.scrollTop = p.scrollHeight;
}

const PANE_PAD = 22;                    // .pane padding both sides, +1px slack
                                        // each side so subpixel rounding can't
                                        // trip the scrollbar on
const MIN_PX = 4;                       // tiny, but pinch-zoom can read it

/* Scale the font so every line fits the viewport exactly — no soft wrap, no
   horizontal scroll. Measured, not guessed: glyph width varies by device and
   font fallback. */
function fitFont(c){
  cols = c || cols;
  const p = document.getElementById('pane');
  if (fitMode === 1){ p.classList.add('wrap'); p.style.fontSize = ''; return; }
  p.classList.remove('wrap');
  if (!p.clientWidth) return;           // screen not laid out yet
  // Fit the terminal's own column count, not the widest line we currently hold.
  // The live screen streams in wider as output arrives; sizing to the tallest
  // line present at open would pick a big font, then shrink it half a second
  // later when a wider live row lands — a visible jump. `cols` is the steady
  // state, so sizing to it is right from the first frame and never shrinks.
  // Over-wide old scrollback (captured when iTerm was wider) is caught by
  // shrinkToFit / soft-wrap instead.
  let widest = cols;

  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;'
    + 'font-family:' + getComputedStyle(p).fontFamily + ';font-size:100px';
  probe.textContent = '0'.repeat(10);
  document.body.appendChild(probe);
  const chAt100 = probe.getBoundingClientRect().width / 10;
  probe.remove();
  const avail = p.clientWidth - PANE_PAD;
  const size = Math.max(MIN_PX, Math.min(15, (avail / widest) * 100 / chAt100));
  p.style.fontSize = size.toFixed(2) + 'px';
}

/* Belt and braces: character counting misses tabs, wide CJK/emoji glyphs and
   any width colorize()'s markup adds. Measure what actually rendered and step
   down until nothing overflows. */
function shrinkToFit(p){
  for (let i = 0; i < 5; i++){
    if (!p.clientWidth || p.scrollWidth <= p.clientWidth){ p.classList.remove('wrap'); return; }
    const cur = parseFloat(p.style.fontSize) || 11;
    const next = Math.max(MIN_PX,
      cur * (p.clientWidth - PANE_PAD) / (p.scrollWidth - PANE_PAD));
    if (next >= cur - 0.05) break;      // bottomed out at the floor
    p.style.fontSize = next.toFixed(2) + 'px';
  }
  // Below the floor, shrinking further is illegible anyway. "Nothing runs off
  // the right edge" is the promise that matters, so soft-wrap instead of
  // handing back a horizontal scrollbar.
  if (p.scrollWidth > p.clientWidth){ p.classList.add('wrap'); p.style.fontSize = ''; }
}

/* The control row is collapsed by default so the terminal owns the screen.
   Choice sticks across sessions — someone who wants the chips wants them. */
let chipsOpen = localStorage.getItem('chips') === '1';
function applyChips(){
  document.getElementById('chips').classList.toggle('on', chipsOpen);
  const b = document.getElementById('ctrlbtn');
  b.classList.toggle('on', chipsOpen);
  b.setAttribute('aria-expanded', chipsOpen ? 'true' : 'false');
}
function toggleChips(){
  chipsOpen = !chipsOpen;
  localStorage.setItem('chips', chipsOpen ? '1' : '0');
  applyChips();
  paint();                       // pane height changed; keep it pinned to bottom
}
applyChips();

function cycleFit(){
  fitMode = fitMode ? 0 : 1;
  document.getElementById('fitbtn').textContent = fitMode ? 'wrap' : 'fit';
  fitFont(cols); paint();
}
window.addEventListener('resize', () => { if (current){ fitFont(cols); paint(); } });

/* With the chip row collapsed the header is the only place mode/effort/context
   still show, so keep it current on every state change. */
function updateMeta(){
  if (!current) return;
  document.getElementById('sm').textContent =
    [current.mode, ({low:'low',medium:'med',high:'high'})[current.effort],
     current.ctx != null ? current.ctx + '%' : null].filter(Boolean).join(' · ');
}

/* chips just mirror state; the options live in the sheet */
function markEffort(level){
  document.getElementById('chip-effort').textContent =
    ({low:'low', medium:'med', high:'high'})[level] || 'effort';
  if (current) current.effort = level;
  updateMeta();
  if (openKind === 'effort') renderSheet();
}
function markMode(mode){
  document.getElementById('chip-mode').textContent = mode || 'mode';
  if (current) current.mode = mode;
  updateMeta();
  if (openKind === 'mode') renderSheet();
}
function markModel(name){
  const m = (name || '').toLowerCase();
  const short = ['opus','sonnet','haiku'].find(x => m.includes(x)) || (name || 'model');
  document.getElementById('chip-model').textContent = short;
  if (openKind === 'model') renderSheet();
}

/* ── bottom sheet ──────────────────────────────────── */
let openKind = null, COMMANDS = [];

function openSheet(kind){ openKind = kind; renderSheet();
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheet-bg').classList.add('on'); }
function closeSheet(){ openKind = null; pendingModel = null;
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('sheet-bg').classList.remove('on'); }

function opt(label, {desc = '', cur = false, cls = '', dis = false, on}){
  const b = document.createElement('button');
  b.className = 'opt' + (cur ? ' cur' : '') + (cls ? ' ' + cls : '');
  b.disabled = dis;
  b.innerHTML = `<span>${esc(label)}</span>` +
                (desc ? `<span class="desc">${esc(desc)}</span>` : '');
  b.onclick = on;
  return b;
}

function renderSheet(){
  const body = document.getElementById('sheet-body');
  const title = document.getElementById('sheet-title');
  body.innerHTML = '';
  const send = current && current.sendable;

  if (openKind === 'effort'){
    title.textContent = 'reasoning effort';
    ['low','medium','high'].forEach(l => body.appendChild(opt(l, {
      cur: current && current.effort === l, dis: !send,
      on: () => { setEffort(l); closeSheet(); }})));
  }

  else if (openKind === 'mode'){
    title.textContent = 'permission mode';
    const bypass = current && current.mode === 'bypass';
    [['plan','read-only planning'], ['auto','auto-accept'],
     ['accept','accept edits'], ['manual','ask every time']]
      .forEach(([m, d]) => body.appendChild(opt(m, {
        desc: d, cur: current && current.mode === m, dis: !send || bypass,
        on: () => { setMode(m); closeSheet(); }})));
    if (bypass){
      const n = document.createElement('div');
      n.className = 'sheet-note warn';
      n.textContent = 'This pane runs with --dangerously-skip-permissions. '
        + 'Shift-Tab does not cycle out of bypass, so mode cannot be changed '
        + 'from here.';
      body.appendChild(n);
    }
  }

  else if (openKind === 'model'){
    title.textContent = 'model';
    const m = ((current && current.model) || '').toLowerCase();
    ['opus','sonnet','haiku'].forEach(name => body.appendChild(opt(
      pendingModel === name ? 'tap again to confirm' : name, {
        desc: pendingModel === name ? '' : (m.includes(name) ? 'current' : ''),
        cur: pendingModel !== name && m.includes(name),
        cls: pendingModel === name ? 'confirm' : '', dis: !send,
        on: () => setModel(name)})));
    const n = document.createElement('div');
    n.className = 'sheet-note warn';
    n.textContent = '/model also rewrites your global default — every future '
      + 'session you start will use it, not just this pane.';
    body.appendChild(n);
  }

  else if (openKind === 'kill'){
    const t = killTarget || {};
    title.textContent = 'end session';
    body.appendChild(opt(`kill ${t.name || 'pane'}`, {
      desc: t.state === 'working' ? 'is working' : (t.state || ''), cls: 'confirm',
      on: () => killPane(t.uuid, t.name || 'pane')}));
    body.appendChild(opt('cancel', {on: closeSheet}));
    const n = document.createElement('div');
    n.className = 'sheet-note warn';
    n.textContent = 'Interrupts the run, exits Claude and closes the iTerm pane '
      + 'on the Mac. There is no undo.';
    body.appendChild(n);
  }

  else if (openKind === 'keys'){
    title.textContent = 'keys';
    KEYSET.forEach(([k, label, desc]) => body.appendChild(opt(label, {
      desc, dis: !send, on: () => { key(k); closeSheet(); }})));
  }

  else if (openKind === 'cmd'){
    title.textContent = 'commands';
    COMMANDS.forEach(c => body.appendChild(opt(c.cmd, {
      desc: c.desc, dis: !send,
      on: () => { runCmd(c.id); closeSheet(); }})));
    if (!COMMANDS.length){
      const n = document.createElement('div');
      n.className = 'sheet-note'; n.textContent = 'loading…';
      body.appendChild(n);
    }
  }
}

/* ── contextual action bar ─────────────────────────── */
const KEYSET = [
  ['esc','esc','interrupt / dismiss'], ['^C','^C','stop'],
  ['s-tab','⇧⇥','cycle mode'], ['enter','⏎','submit'],
  ['up','↑','history up'], ['down','↓','history down'],
  ['tab','⇥','complete'], ['^D','^D','eof'],
];

let livePrompt = null;

function renderActions(){
  const bar = document.getElementById('actionbar');
  const send = current && current.sendable;
  bar.innerHTML = '';
  if (!send){ bar.className = 'actionbar'; return; }

  if (livePrompt && livePrompt.options && livePrompt.options.length){
    // Claude is asking. Show ITS options verbatim, one tap each.
    bar.className = 'actionbar on';
    if (livePrompt.question){
      const q = document.createElement('span');
      q.className = 'q'; q.textContent = livePrompt.question;
      bar.appendChild(q);
    }
    const wrap = document.createElement('div');
    wrap.className = 'opts';
    livePrompt.options.forEach(o => {
      const b = document.createElement('button');
      const yes = /^(yes|approve|accept|proceed|allow)/i.test(o.label);
      const no  = /^(no|cancel|reject|keep planning)/i.test(o.label);
      b.className = 'act' + (o.selected ? ' sel' : '') +
                    (yes ? ' yes' : '') + (no ? ' no' : '');
      b.innerHTML = `<span class="num">${esc(o.key)}</span><span>${esc(o.label)}</span>`;
      b.onclick = () => { key(o.key); livePrompt = null; renderActions(); };
      wrap.appendChild(b);
    });
    bar.appendChild(wrap);
    return;
  }

  if (current.state === 'working'){
    // Busy: the only things worth one-tap access are the interrupts.
    bar.className = 'actionbar on';
    const wrap = document.createElement('div');
    wrap.className = 'opts row';
    [['esc','esc','stop'], ['^C','^C','stop']].forEach(([k, lbl]) => {
      const b = document.createElement('button');
      b.className = 'act slim stop'; b.textContent = lbl;
      b.onclick = () => key(k);
      wrap.appendChild(b);
    });
    bar.appendChild(wrap);
    return;
  }
  bar.className = 'actionbar';
}

async function runCmd(id){
  if (!current) return;
  buzz(12);
  try { const r = await post('/api/cmd', {uuid: current.uuid, cmd: id});
        toast('sent ' + r.cmd); }
  catch(e){ toast(String(e.message), true); }
}

function loadCommands(){
  fetch('/api/commands')
    .then(r => r.json()).then(d => { COMMANDS = d.commands || [];
                                     if (openKind === 'cmd') renderSheet(); })
    .catch(() => {});
}

async function setMode(mode){
  if (!current) return;
  buzz(12);
  try {
    const r = await post('/api/mode', {uuid: current.uuid, mode});
    markMode(r.mode); toast('mode → ' + r.mode);
  } catch(e){ toast(String(e.message), true); }
}

/* /model rewrites ~/.claude/settings.json — it repoints every FUTURE session,
   not just this one. Two taps required, and the second is labelled. */
let pendingModel = null, pendingTimer = null;
function setModel(name){
  if (!current) return;
  if (pendingModel !== name){          // first tap arms, second fires
    pendingModel = name; renderSheet();
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(() => { pendingModel = null; renderSheet(); }, 4000);
    return;
  }
  clearTimeout(pendingTimer); pendingModel = null;
  buzz(18); closeSheet();
  post('/api/model', {uuid: current.uuid, model: name})
    .then(() => toast('model \u2192 ' + name + ' (global default changed)'))
    .catch(e => toast(String(e.message), true));
}

async function setEffort(level){
  if (!current) return;
  buzz(12);
  markEffort(level);
  try {
    await post('/api/effort', {uuid: current.uuid, level});
    toast('effort → ' + level);
  } catch(e){ toast(String(e.message), true); markEffort(current.effort); }
}

function showFleet(){
  if (paneWS) { paneWS.close(); paneWS = null; }
  current = null;
  document.getElementById('s-session').classList.remove('on');
  document.getElementById('s-usage').classList.remove('on');
  document.getElementById('s-fleet').classList.add('on');
}

async function post(path, body){
  const r = await fetch(path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(()=>({}));
  if (r.status === 401){ lock(d.relock ? 'idle' : 'gone'); throw new Error('locked'); }
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

/* Spawn a fresh Claude pane on the Mac. The server splits a new iTerm pane in a
   scratch dir; we arm PENDING_PANE with its UUID so the moment it lands in the
   fleet we drop straight into it — you answer its first-run trust prompt there. */
async function spawnSession(){
  const fab = document.getElementById('fab');
  fab.disabled = true; buzz(14);
  try {
    const r = await post('/api/spawn', {});
    PENDING_PANE = r.uuid;
    toast('new clawd hatching…');
  } catch(e){ toast(String(e.message), true); }
  finally { setTimeout(() => fab.disabled = false, 1500); }
}

async function key(k){
  if (!current) return;
  buzz(8);
  try { await post('/api/key', {uuid: current.uuid, key: k}); }
  catch(e){ toast(String(e.message), true); }
}

const input = document.getElementById('input'), sendbtn = document.getElementById('sendbtn');
input.addEventListener('input', () => {
  sendbtn.disabled = !input.value.trim() || !(current && current.sendable);
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 132) + 'px';
});
async function send(){
  const t = input.value.trim();
  if (!t || !current) return;
  buzz(12);
  try {
    await post('/api/send', {uuid: current.uuid, text: t, submit: true});
    input.value = ''; input.style.height = 'auto'; sendbtn.disabled = true;
  } catch(e){ toast(String(e.message), true); }
}

/* ── usage screen ──────────────────────────────────── */
const fmtTok = n => n >= 1e9 ? (n/1e9).toFixed(1)+'B'
                 : n >= 1e6 ? (n/1e6).toFixed(1)+'M'
                 : n >= 1e3 ? (n/1e3).toFixed(0)+'k' : String(n);
const fmtUsd = n => n >= 1000 ? '$'+(n/1000).toFixed(2)+'k' : '$'+n.toFixed(2);
const fmtAge = s => s == null ? '' : s < 60 ? `${s}s`
                 : s < 3600 ? `${Math.floor(s/60)}m` : `${Math.floor(s/3600)}h`;

/* The limits API hands back raw floats (4.000000000000004%). Nobody needs the
   tail — one whole number reads at a glance, which is the whole point here. */
const pct = n => n == null ? '—' : Math.round(n) + '%';

/* Reserved status palette — never the categorical hues. */
function limitColor(p){
  return p >= 90 ? 'var(--st-crit)' : p >= 75 ? 'var(--st-serious)'
       : p >= 50 ? 'var(--st-warn)' : 'var(--st-good)';
}
function resetIn(ts){
  if (!ts) return '';
  const m = Math.max(0, Math.round((ts*1000 - Date.now())/60000));
  return m >= 60 ? `resets in ${Math.floor(m/60)}h ${m%60}m` : `resets in ${m}m`;
}

let USAGE_D = null, usageTimer = null, USAGE_SIG = '';
// Absolute server epoch (unix seconds) the usage data was computed at. Same idea
// as the fleet's s.work_since: fixed reference the client subtracts its own clock
// from every frame, so the label keeps counting between the 60s refetches.
let USAGE_AT = 0, _usageAgeTxt = '';

/* Freshness label, ticked off the client clock against the server's compute
   epoch — exactly how the fleet working-timers count (Date.now()/1000 - epoch).
   Called from the rAF tick() loop, which runs every frame regardless of screen. */
function paintUsageAge(){
  const el = document.getElementById('usage-age');
  if (!el) return;
  if (!USAGE_AT){ if (_usageAgeTxt !== '…'){ el.textContent = _usageAgeTxt = '…'; } return; }
  const s = Math.max(0, Math.floor(Date.now()/1000 - USAGE_AT));
  const txt = s ? `${fmtAge(s)} ago` : 'live';
  if (txt !== _usageAgeTxt){ el.textContent = _usageAgeTxt = txt; }
}

/* Full page reload that can't serve a stale shell: wipe any CacheStorage first
   (belt-and-suspenders — there's no service worker today), then reload from a
   cache-busted URL so the browser refetches index.html and its JS. */
async function hardReload(){
  try {
    if (window.caches) {
      const ks = await caches.keys();
      await Promise.all(ks.map(k => caches.delete(k)));
    }
  } catch(e){}
  const u = new URL(location.href);
  u.searchParams.set('_', Date.now());   // defeat any intermediary cache
  location.replace(u.toString());
}

function showUsage(){
  document.getElementById('s-fleet').classList.remove('on');
  document.getElementById('s-session').classList.remove('on');
  document.getElementById('s-usage').classList.add('on');
  USAGE_SIG = '';
  renderUsage();                       // paint from the live socket immediately
  loadUsage();
  clearInterval(usageTimer);
  usageTimer = setInterval(() => {
    if (document.getElementById('s-usage').classList.contains('on')) loadUsage();
    else { clearInterval(usageTimer); usageTimer = null; }
  }, 60000);
  // The per-second label tick is driven by the rAF tick() loop, same as the
  // fleet timers — no separate interval to keep alive here.
}

async function loadUsage(){
  const el = document.getElementById('usage-body');
  try {
    const r = await fetch('/api/usage');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    USAGE_D = d;
    // Prefer the server's absolute compute epoch; fall back to (now - age) for
    // an older server, and finally to now.
    USAGE_AT = d.computed_at || (d.age != null ? Date.now()/1000 - d.age : Date.now()/1000);
    renderUsage();
    paintUsageAge();
  } catch(e){
    if (!USAGE_D) el.innerHTML = `<div class="empty">usage failed:\n${esc(String(e.message))}</div>`;
  }
}

function renderUsage(){
  const el = document.getElementById('usage-body');
  const d = USAGE_D;
  const lim = LIMITS || (d && d.limits) || {};
  const fh = lim.five_hour || {}, sd = lim.seven_day || {};
  paintUsageAge();   // ticks off the client clock, not the frozen d.age snapshot

  // Live fleet, straight off the socket — this screen is about what is running
  // right now, so nothing here comes from history.
  const rows = SESSIONS || [];
  const waiting = rows.filter(r => r.prompt);
  const working = rows.filter(r => !r.prompt && r.state === 'working');
  const idle    = rows.filter(r => !r.prompt && r.state !== 'working');
  const liveCost = rows.reduce((a, r) => a + (r.cost || 0), 0);
  const act = [...waiting, ...working];   // needs me / needs watching, in that order

  // The socket repaints once a second. Rebuilding the DOM that often eats taps
  // and flickers, so only rebuild when something on THIS screen actually moved.
  const sig = JSON.stringify([fh.used_percentage, sd.used_percentage,
    d && d.today, d && d.all_time, Math.round(liveCost * 100), idle.length,
    act.map(r => [r.uuid, r.state, r.ctx, !!r.prompt, bubbleText(r),
                  r.tokens, r.prompts, r.files, r.lines_add, r.lines_del,
                  Math.floor((r.age || 0) / 5)])]);   // age coarsened to 5s buckets
  if (sig === USAGE_SIG) return;
  USAGE_SIG = sig;
  const at = (d && d.all_time) || null;

  el.innerHTML = `
    <div class="usec">
      <h3>rate limits</h3>
      ${[['session', fh], ['7-day', sd]].map(([n, l]) => `
        <div class="meter">
          <div class="top"><span>${n === 'session' ? '5-hour' : n} <span
            style="color:var(--dimmer)">${
            esc(resetIn(l.resets_at))}</span></span><b>${pct(l.used_percentage)}</b></div>
          <div class="track tall"><i style="width:${Math.min(100, l.used_percentage||0)}%;
            background:${limitColor(l.used_percentage||0)}"></i></div>
        </div>`).join('')}
    </div>

    <div class="usec">
      <h3>spend</h3>
      <div class="tiles">
        <div class="tile"><div class="k">today</div>
          <div class="v">${d ? fmtUsd(d.today.cost) : '—'}</div>
          <div class="s">${d ? fmtTok(d.today.tokens) + ' tokens' : ''}</div></div>
        <div class="tile"><div class="k">live fleet</div>
          <div class="v">${fmtUsd(liveCost)}</div>
          <div class="s">${act.length} active · ${idle.length} idle</div></div>
      </div>
    </div>

    <div class="usec">
      <h3>all time</h3>
      <div class="tiles tri">
        <div class="tile"><div class="k">cost</div>
          <div class="v">${at ? fmtUsd(at.cost) : '—'}</div>
          <div class="s">${at ? at.active_days + ' days' : ''}</div></div>
        <div class="tile"><div class="k">tokens</div>
          <div class="v">${at ? fmtTok(at.tokens) : '—'}</div></div>
        <div class="tile"><div class="k">sessions</div>
          <div class="v">${at ? fmtTok(at.sessions) : '—'}</div></div>
      </div>
    </div>

    <div class="usec">
      <h3><span>${waiting.length ? 'needs you' : 'running'}</span>
        <em>${act.length} session${act.length === 1 ? '' : 's'}${
          waiting.length ? ' · ' + waiting.length + ' blocked' : ''}</em></h3>
      <div class="agents">
        ${act.length ? act.map(agentCard).join('')
                     : '<div class="unone">nothing running — the yard is quiet</div>'}
      </div>
    </div>`;

  el.querySelectorAll('.ucard').forEach(n =>
    n.onclick = () => openSession(n.dataset.u));
}

/* One running-agent card. Working panes show the cc-dashboard metrics (context,
   tokens, files, +/- lines); a pane blocked on a prompt shows the question big
   and a tap-to-answer nudge instead. */
function agentCard(r){
  const w = !!r.prompt;
  // Same live timer the fleet uses: ticked off the server's start epoch and the
  // client clock (see the rAF loop), not the frozen r.age snapshot.
  const age = r.work_since
    ? `<span class="age" data-since="${r.work_since}">${
        fmtDur(Date.now()/1000 - r.work_since)}</span>`
    : (r.age != null ? `<span class="age">${fmtAge(r.age)}</span>` : '');
  // No "working" badge: a card only exists because the pane is live, so it would
  // be redundant. Blocked panes still flag "needs you".
  const hd = `<div class="hd"><span class="nm">${esc(r.name)}</span>
      ${w ? '<span class="chip">needs you</span>' : ''}${age}</div>`;
  if (w){
    return `<div class="ucard waiting" data-u="${esc(r.uuid)}">
      ${hd}
      <div class="act">${esc(r.prompt.question || 'needs an answer')}</div>
      <div class="answer">tap to answer ›</div>
    </div>`;
  }
  const ctx = r.ctx != null ? `
    <div class="ctxbar">
      <div class="track"><i style="width:${Math.min(100, r.ctx)}%;
        background:${ctxColor(r.ctx)}"></i></div><b>${r.ctx}%</b></div>` : '';
  const foot = [r.model, r.effort, r.cost ? fmtUsd(r.cost) : null]
                 .filter(Boolean).join(' · ');
  return `<div class="ucard working" data-u="${esc(r.uuid)}">
    ${hd}
    ${ctx}
    <div class="stats"><b>${fmtTok(r.tokens || 0)}</b> tok · <b>${
      r.prompts || 0}</b> prompts · <b>${r.files || 0}</b> files · <span
      class="add">+${r.lines_add || 0}</span> <span class="del">−${r.lines_del || 0}</span></div>
    ${foot ? `<div class="foot">${esc(foot)}</div>` : ''}
  </div>`;
}

/* one line of what a pane is doing, reusing the yard's activity distiller */
function bubbleText(r){
  try { const a = activity(r); return [a.verb, a.rest].filter(Boolean).join(' '); }
  catch(e){ return ''; }
}

/* Usage scrolls now — no fit pass needed. */


/* ── passkey gate ──────────────────────────────────────
   The session cookie proves the QR (or the pasted token) arrived over the
   tailnet; the passkey proves it is still THIS person holding the phone.
   Everything that writes to a pane sits behind it, and an idle session drops
   back here rather than staying open on a phone someone else picked up. */
const b64url = {
  dec: s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)),
  enc: b => btoa(String.fromCharCode(...new Uint8Array(b)))
              .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
};
let AUTH = {level:'none', passkey_capable:false, passkey_registered:false};

function lock(why){
  const t = document.getElementById('lock-title');
  const m = document.getElementById('lock-msg');
  const b = document.getElementById('lock-go');
  const w = document.getElementById('lock-warn');
  document.getElementById('lock-err').textContent = '';
  if (why === 'gone'){
    t.textContent = 'Session ended';
    m.textContent = 'Open the server URL again and paste the token to start a new one.';
    b.style.display = 'none';
  } else if (why === 'enrol'){
    t.textContent = 'Add this phone';
    m.textContent = "Register a passkey so only your fingerprint can drive the "
                  + "fleet. The key never leaves this phone's secure element.";
    b.style.display = ''; b.textContent = 'Register passkey'; b.onclick = enrol;
  } else {
    t.textContent = 'Locked';
    m.textContent = 'Unlock with your passkey to reach the yard.';
    b.style.display = ''; b.textContent = 'Unlock'; b.onclick = unlock;
  }
  w.textContent = AUTH.passkey_capable ? ''
    : 'No TLS hostname on this URL, so passkeys are unavailable and the session '
    + 'cookie is the only thing protecting the fleet. Use the tailnet name.';
  document.getElementById('lock').classList.add('on');
}
const unlockUI = () => document.getElementById('lock').classList.remove('on');
const lockErr = e => document.getElementById('lock-err').textContent =
  String((e && e.message) || e).slice(0, 160);

async function authState(){
  try { AUTH = await (await fetch('/auth/whoami')).json(); }
  catch(e){ AUTH = {level:'none'}; }
  return AUTH;
}

async function webauthn(url, kind){
  const r = await fetch(url + '/begin', {method:'POST'});
  const o = await r.json();
  if (!r.ok) throw new Error(o.error || r.status);
  o.challenge = b64url.dec(o.challenge);
  if (o.user) o.user.id = b64url.dec(o.user.id);
  (o.excludeCredentials || []).forEach(c => c.id = b64url.dec(c.id));
  (o.allowCredentials || []).forEach(c => c.id = b64url.dec(c.id));
  const c = kind === 'create'
    ? await navigator.credentials.create({publicKey: o})
    : await navigator.credentials.get({publicKey: o});
  const rs = c.response;
  const body = {id: c.id, rawId: b64url.enc(c.rawId), type: c.type,
                clientExtensionResults: c.getClientExtensionResults(),
                response: {clientDataJSON: b64url.enc(rs.clientDataJSON)}};
  for (const k of ['attestationObject','authenticatorData','signature','userHandle'])
    if (rs[k]) body.response[k] = b64url.enc(rs[k]);
  const done = await fetch(url + '/complete', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const d = await done.json().catch(()=>({}));
  if (!done.ok) throw new Error(d.error || done.status);
  buzz(20); unlockUI(); start();
}
const enrol  = () => webauthn('/auth/register', 'create').catch(lockErr);
const unlock = () => webauthn('/auth/login', 'get').catch(lockErr);

/* A phone that sat in a pocket comes back locked. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !started) gate();
});

async function gate(){
  await authState();
  if (AUTH.level === 'verified'){ unlockUI(); return start(); }
  // A registered passkey is enough to get back in even with no session — the
  // unlock mints one. So offer Unlock before falling back to the token gate.
  if (AUTH.passkey_capable && AUTH.passkey_registered) return lock('idle');
  if (!AUTH.session) return lock('gone');
  if (AUTH.passkey_capable) return lock('enrol');
  unlockUI(); start();          // plain http on a bare IP: cookie only, and it says so
}

/* Nothing connects until the passkey gate says so — a locked phone must not be
   holding an open socket onto the fleet. */
let started = false;
function start(){
  if (started) return;
  started = true;
  loadCommands();
  connectFleet();
  // deep links, for per-target home-screen shortcuts:
  //   ?screen=usage  → the dashboard
  //   ?pane=<uuid>   → straight into one session, once the fleet list arrives
  const dl = new URLSearchParams(location.search);
  if (dl.get('screen') === 'usage') showUsage();
  PENDING_PANE = dl.get('pane') || '';
}
gate();
</script>

<div id="lock">
  <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="body" x="2.5" y="6.5" width="19" height="14" rx="4.5"/><rect class="body" x="5" y="2" width="2.6" height="5" rx="1.3"/><rect class="body" x="16.4" y="2" width="2.6" height="5" rx="1.3"/><rect class="eye" x="7.4" y="11" width="3.6" height="5" rx="1.4"/><rect class="eye" x="13" y="11" width="3.6" height="5" rx="1.4"/></svg></div>
  <h2 id="lock-title">Locked</h2>
  <p id="lock-msg">Unlock with your passkey to reach the yard.</p>
  <button id="lock-go" onclick="unlock()">Unlock</button>
  <div class="err" id="lock-err"></div>
  <div class="warn" id="lock-warn"></div>
</div>
</body>
</html>
